# RustSec advisories of Cargo.lock: weekly - advisories appear for versions already in the lock, without any change
# here - and on every change of the dependencies. Warnings (unmaintained, yanked) fail it too: the core keeps 0 / 0.
name: Audit

on:
  schedule:
    - cron: "17 5 * * 1"
  push:
    branches: [main]
    paths: ["**/Cargo.toml", "Cargo.lock"]
  pull_request:
    paths: ["**/Cargo.toml", "Cargo.lock"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-audit@0.23.0
      - run: cargo audit --deny warnings
